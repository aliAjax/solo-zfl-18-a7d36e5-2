<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌游联赛编排台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SEASON · SCHEDULE · TABLES</p>
          <h1>桌游联赛编排台</h1>
        </div>
        <div class="summary">
          <div><span>赛季</span><strong id="statSeasons">0</strong></div>
          <div><span>玩家</span><strong id="statPlayers">0</strong></div>
          <div><span>轮次</span><strong id="statRounds">0</strong></div>
        </div>
      </header>

      <nav class="tabs" id="tabs">
        <button data-tab="season" class="active">赛季</button>
        <button data-tab="people">玩家与阵营</button>
        <button data-tab="round">赛程与桌次</button>
        <button data-tab="results">赛果</button>
        <button data-tab="standings">积分榜</button>
        <button data-tab="audit">审计</button>
        <button data-tab="io">导入导出</button>
      </nav>

      <div id="conflictBar" class="conflict-bar hidden"></div>
      <div id="toast" class="toast hidden"></div>

      <section id="tab-season" class="tab-panel"></section>
      <section id="tab-people" class="tab-panel hidden"></section>
      <section id="tab-round" class="tab-panel hidden"></section>
      <section id="tab-results" class="tab-panel hidden"></section>
      <section id="tab-standings" class="tab-panel hidden"></section>
      <section id="tab-audit" class="tab-panel hidden"></section>
      <section id="tab-io" class="tab-panel hidden"></section>
    </main>

    <script type="module" src="js/ui.js"></script>
  </body>
</html>
